#Aplicacion
spring.application.name=ms-auth
server.port=8081

#Base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/tfi_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
