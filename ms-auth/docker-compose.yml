version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: tfi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tfi_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: tfi-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: tfi_db
      DB_USER: root
      DB_PASS: root
      JWT_SECRET: clave-super-secreta-tfi-2024-debe-tener-256-bits-minimo
      JWT_EXPIRATION: 86400000
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: